[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aliyun_mcp*"]
[project]
name = "aliyun-mcp-multiaccount"
version = "0.1.0"
description = "Multi-Account Alibaba Cloud MCP Service"
authors = [{ name = "aliyun-mcp", email = "aliyun-mcp@example.com" }]
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=3.2.4",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "alibabacloud_tea_openapi>=0.3.8",
  "alibabacloud_tea_util>=0.3.11",
  "alibabacloud_ecs20140526>=7.0.0",
  "alibabacloud_vpc20160428>=7.0.0",
  "alibabacloud_tag20180828>=1.0.0",
  "alibabacloud_sts20150401>=1.0.0",
  "alibabacloud_bssopenapi20171214>=5.0.0",
  "alibabacloud_cms20190101>=4.0.0",
  "alibabacloud_actiontrail20200706>=2.0.0",
  "alibabacloud_rds20140815>=15.0.0",
  "alibabacloud_slb20140515>=3.0.0",
  "alibabacloud_alb20200616>=1.0.0",
  "alibabacloud_nlb20220430>=4.0.0",
  "alibabacloud_r-kvstore20150101>=6.0.0",
  "alibabacloud_dds20151201>=9.0.0",
  "alibabacloud_cs20151215>=6.0.0",
  "oss2>=2.19.0",
  "aliyun-log-python-sdk>=0.9.0",
]

[project.scripts]
aliyun-mcp = "main:main"

[tool.ruff]
line-length = 120
target-version = "py310"
